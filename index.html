<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#140f1e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Daggerheart — Scheda personaggio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #140f1e; }
  .dh-root {
    --bg: #140f1e; --panel: #1d1730; --panel-alt: #241c39; --border: #38304f;
    --hope: #e8b649; --hope-soft: #6b5730; --fear: #9a6ee0; --fear-soft: #4a3468;
    --text: #f3eef9; --text-dim: #a99cc0; --danger: #d97a6c;
    font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 14px 12px 40px; box-sizing: border-box;
  }
  .dh-root * { box-sizing: border-box; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; position: relative; }
  .title { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 26px; margin: 0; letter-spacing: 0.3px;
    background: linear-gradient(90deg, var(--hope), var(--fear)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin: 2px 0 0; }
  .lang-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .lang-toggle button { background: var(--panel); color: var(--text-dim); border: none; padding: 6px 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .lang-toggle button.active { background: var(--fear-soft); color: var(--text); }

  .status-row { margin: 10px 0 8px; font-size: 11px; color: var(--text-dim); display: flex; align-items: center; }
  .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; background: var(--hope); }
  .status-dot.saving { background: var(--fear); } .status-dot.error { background: var(--danger); }

  .header-controls { display: flex; gap: 8px; flex-shrink: 0; }
  .menu-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text-dim); width: 32px; height: 32px;
    border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; line-height: 1; }
  .menu-btn.active { background: var(--fear-soft); border-color: var(--fear); color: var(--text); }
  .action-menu { position: absolute; top: calc(100% + 6px); right: 0; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px; min-width: 190px; z-index: 20; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
  .action-menu button { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text);
    padding: 9px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .action-menu button:hover { background: var(--panel-alt); }

  .load-panel { background: var(--panel); border: 1px solid var(--fear); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .load-panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .load-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid var(--border);
    background: var(--panel-alt); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
  .load-item-info { font-size: 12.5px; }
  .load-item-name { font-weight: 600; }
  .load-item-meta { color: var(--text-dim); font-size: 11px; }
  .load-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .small-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 11.5px;
    padding: 5px 8px; border-radius: 6px; cursor: pointer; }
  .small-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .small-btn.accent:hover { border-color: var(--hope); color: var(--hope); }

  .tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; }
  .tab-btn { flex: 0 0 auto; background: var(--panel); border: 1px solid var(--border); color: var(--text-dim);
    padding: 8px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .tab-btn.active { background: var(--fear-soft); border-color: var(--fear); color: var(--text); }
  .condition-row { display: flex; gap: 6px; flex-wrap: wrap; }

  .section { background: var(--panel); border: 1px solid var(--border); border-top: 3px solid var(--border);
    border-radius: 12px; padding: 14px; margin-bottom: 12px; max-width: 720px; }
  .section-title { font-family: 'Fraunces', Georgia, serif; font-size: 15px; margin: 0 0 10px; font-weight: 600; color: var(--text); }
  .hint { color: var(--text-dim); font-size: 11.5px; line-height: 1.5; margin: 6px 0 0; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
  .field-wide { grid-column: 1 / -1; }
  .field-label { color: var(--text-dim); font-size: 11px; }
  input, select, textarea {
    background: var(--panel-alt); border: 1px solid var(--border); color: var(--text);
    padding: 8px 9px; border-radius: 8px; font-size: 14px; font-family: 'Inter', system-ui, sans-serif; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--hope); }
  textarea { resize: vertical; min-height: 60px; }
  textarea.tall { min-height: 120px; }
  textarea.autosize { resize: none; overflow: hidden; }

  .trait-card { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
  .trait-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .trait-name { font-weight: 600; font-size: 13px; }
  .trait-mod-input { width: 52px; text-align: center; font-weight: 700; }
  .trait-subs { display: flex; flex-wrap: wrap; gap: 4px; }
  .trait-sub { font-size: 10.5px; color: var(--text-dim); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; }

  .ghost-btn { background: none; border: 1px dashed var(--border); color: var(--text-dim); padding: 7px 10px;
    border-radius: 8px; font-size: 12px; cursor: pointer; width: 100%; margin-top: 4px; }
  .ghost-btn:hover { border-color: var(--hope); color: var(--hope); }

  .vital-block { margin-bottom: 12px; }
  .vital-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .vital-label { font-size: 12.5px; font-weight: 600; }
  .vital-max { font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .vital-max input { width: 46px; padding: 3px 5px; font-size: 12px; }

  .pip-track { display: flex; flex-wrap: wrap; gap: 5px; }
  .pip { width: 20px; height: 20px; border-radius: 50%; border: 2px solid; cursor: pointer; padding: 0; }

  .gold-row { display: flex; gap: 8px; }
  .gold-col { flex: 1; text-align: center; }
  .gold-col .field-label { display: block; margin-bottom: 4px; }

  .threshold-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 4px; }
  .threshold-badge { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; text-align: center; flex: 1; }
  .threshold-badge b { display: block; font-size: 17px; font-family: 'Fraunces', Georgia, serif; }
  .threshold-badge.major b { color: var(--hope); } .threshold-badge.severe b { color: var(--fear); }

  .dmg-result { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--panel-alt); border: 1px solid var(--border); font-size: 13px; font-weight: 600; }

  .weapon-block { border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 10px; background: var(--panel-alt); }
  .weapon-title { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; font-weight: 600; }

  .list-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; margin-bottom: 8px; background: var(--panel-alt); }
  .remove-x { background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; line-height: 1; padding: 4px; }
  .remove-x:hover { color: var(--danger); }
  .list-row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

  @media (min-width: 760px) {
    .dh-root { max-width: 760px; margin: 0 auto; padding-top: 28px; }
  }
</style>
</head>
<body>
<div id="root"></div>
